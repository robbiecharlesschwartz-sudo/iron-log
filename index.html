<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Iron Log — a workout tracker that tells you what to lift next</title>
<meta name="description" content="Free strength training log. Plan your week, run the session with a rest timer that works with your phone locked, and see what to add weight to next — worked out from your own lifts, never guessed." />
<link rel="canonical" href="https://ironlogexercise.netlify.app/" />

<!-- Sharing. The app icon stands in for a purpose-made OG image deliberately: a
     1200x630 PNG would be the largest file this site ships, fetched by every crawler
     that touches the page, to show something nobody looks at twice. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Iron Log" />
<meta property="og:url" content="https://ironlogexercise.netlify.app/" />
<meta property="og:title" content="Iron Log — a workout tracker that tells you what to lift next" />
<meta property="og:description" content="Free strength training log. Plan your week, run the session with a rest timer that works with your phone locked, and see what to add weight to next — worked out from your own lifts, never guessed." />
<meta property="og:image" content="https://ironlogexercise.netlify.app/icon-512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Iron Log — a workout tracker that tells you what to lift next" />
<meta name="twitter:description" content="Free strength training log. Plan your week, run the session with a rest timer that works with your phone locked, and see what to add weight to next — worked out from your own lifts, never guessed." />
<meta name="twitter:image" content="https://ironlogexercise.netlify.app/icon-512.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2563EB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Iron Log" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="stylesheet" href="app.css" />
<style>
  html,body{background:#FFFFFF;margin:0;touch-action:manipulation;}
  /*
   * The public page follows the reader's system theme; the app is light always.
   * Painting white and letting React repaint it dark a moment later is a flash on
   * every first visit in dark mode, so the route is read before anything renders
   * (the script below sets the class) and the background is settled here.
   */
  @media (prefers-color-scheme: dark) {
    html.at-root, html.at-root body { background:#0D0E12; }
  }
  /* Belt-and-suspenders: user-scalable=no is ignored by some browsers (notably iOS Safari
     in certain versions), so also block pinch-zoom and double-tap-zoom at the CSS level. */
  * { touch-action: manipulation; }
  html { touch-action: pan-x pan-y; }
</style>
<script>
  /* Runs in the head, before the first paint, so the rule above can settle the
     background with no flash. The paths match src/lib/route.js. */
  (function () {
    var p = location.pathname.replace(/\/+$/, "") || "/";
    if (/^\/(index\.html|privacy|terms|contact)?$/.test(p)) document.documentElement.className = "at-root";
  })();
</script>
</head>
<body>
<div id="root"></div>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").then((reg) => {
        // Actively check the server for a new sw.js right away, and again whenever
        // the tab regains focus — don't just wait for the browser's own (slow,
        // sometimes 24h-delayed) update check.
        reg.update();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update();
        });
      });
    });
    // Once a new service worker takes control, the page is running old JS alongside
    // a new cache — reload once so the user is always on what was actually deployed.
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  }
  // iOS Safari sometimes allows pinch-zoom and double-tap-zoom even with
  // user-scalable=no in the viewport meta tag. Block both explicitly.
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("gesturechange", (e) => e.preventDefault());
  document.addEventListener("gestureend", (e) => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault(); // pinch = 2+ fingers
  }, { passive: false });
</script>
<script src="app.js"></script>
</body>
</html>
