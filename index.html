<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Iron Log</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2563EB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Iron Log" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="stylesheet" href="app.css" />
<style>
  html,body{background:#FFFFFF;margin:0;touch-action:manipulation;}
  /* Belt-and-suspenders: user-scalable=no is ignored by some browsers (notably iOS Safari
     in certain versions), so also block pinch-zoom and double-tap-zoom at the CSS level. */
  * { touch-action: manipulation; }
  html { touch-action: pan-x pan-y; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").then((reg) => {
        // Actively check the server for a new sw.js right away, and again whenever
        // the tab regains focus — don't just wait for the browser's own (slow,
        // sometimes 24h-delayed) update check.
        reg.update();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update();
        });
      });
    });
    // Once a new service worker takes control, the page is running old JS alongside
    // a new cache — reload once so the user is always on what was actually deployed.
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  }
  // iOS Safari sometimes allows pinch-zoom and double-tap-zoom even with
  // user-scalable=no in the viewport meta tag. Block both explicitly.
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("gesturechange", (e) => e.preventDefault());
  document.addEventListener("gestureend", (e) => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault(); // pinch = 2+ fingers
  }, { passive: false });
</script>
<script src="app.js"></script>
</body>
</html>
